<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BrandCore — read a brand from its website, then plan, write, and ship on-brand campaigns from one workspace." />
    <meta name="theme-color" content="#FBFAF7" />
    <meta property="og:title" content="BrandCore" />
    <meta property="og:description" content="Read a brand from its website, then plan, write, and ship on-brand campaigns from one workspace." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BrandCore" />
    <meta name="twitter:description" content="Read a brand from its website, then plan, write, and ship on-brand campaigns from one workspace." />
    <meta name="twitter:image" content="/og-image.png" />
    <title>BrandCore — Brand workspace</title>
    <!-- Real favicon set (src/frontend/public/, regenerable from
         brand-assets/logo-source.svg) - was previously a single inline SVG
         data URI with no PNG fallbacks, apple-touch-icon, or manifest. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Google Identity Services - powers the "Continue with Google" button
         (GoogleAuthButton.tsx). Loaded async/defer so it never blocks first
         paint; the button itself checks window.google before rendering, so
         a slow/blocked load just means the button briefly doesn't appear
         rather than breaking the page. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-brand-bg text-brand-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
